<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Full-bleed background: OS applies its own icon mask, no inset/rounding here -->
  <rect x="0" y="0" width="1024" height="1024" fill="#111111"/>

  <!-- Back Sheet -->
  <rect x="352" y="252" width="380" height="380" rx="48" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10"/>

  <!-- Front Sheet -->
  <rect x="292" y="392" width="380" height="380" rx="48" fill="#111111" stroke="#FFFFFF" stroke-width="14"/>

  <!-- Template Variable Glyph -->
  <text x="482" y="620" font-family="Menlo, Consolas, monospace" font-size="200" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">{ }</text>
</svg>
